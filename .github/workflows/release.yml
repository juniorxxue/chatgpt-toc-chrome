name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest version
        id: manifest
        run: |
          VERSION="$(python3 - <<'PY'
          import json
          with open("manifest.json", "r", encoding="utf-8") as fh:
              print(json.load(fh)["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=chatgpt-toc-chrome-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          mkdir -p dist
          zip -r "dist/${{ steps.manifest.outputs.zip_name }}" \
            manifest.json \
            code.js \
            code.css \
            icons \
            README.md \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            -x "*.DS_Store"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
